<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pinterest</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
  </head>
  <body>
    <div class="Card">
      <img src="./img/The Lord Of The Rings.jpg" alt="pinterest-img" />
      <button class="Save-button">Save</button>
      <button class="caption-button">
        <span class="material-symbols-outlined"> arrow_outward </span>
        Lord of the rings
      </button>
      <button class="download-button">
        <i
          class="fa-sharp fa-solid fa-arrow-up-from-bracket"
          style="color: rgb(0, 0, 0)"
        ></i>
      </button>
      <button class="sharing-button">
        <i class="fa-solid fa-ellipsis" style="color: rgb(0, 0, 0)"></i>
      </button>
    </div>
  </body>
</html>
